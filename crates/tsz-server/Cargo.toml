[package]
name = "tsz-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
async-stream = "0.3"
async-trait = "0.1"
bip39 = "2"
clap.workspace = true
hex.workspace = true
futures-core = "0.3"
rand.workspace = true
rand10 = { package = "rand", version = "0.10" }
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
secrecy = "0.8"
tonic = "0.14"

# Pin the Zakura type family even where API-facing values are serialized. The
# wallet adapter can never silently resolve the upstream LRZ crypto packages.
zcash_keys = { package = "zakura-keys", version = "=1.2.0", default-features = false, features = ["orchard", "transparent-inputs", "unstable"] }
zcash_primitives = { package = "zakura-primitives", version = "=1.2.0", default-features = false }
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc5", features = ["orchard", "transparent-inputs", "sync", "lightwalletd-tonic-transport"] }
zcash_client_sqlite = { package = "zakura-client-sqlite", version = "=0.1.0-rc5", features = ["orchard", "transparent-inputs", "unstable"] }
zcash_proofs = { package = "zakura-proofs", version = "=1.2.0", features = ["bundled-prover"] }
pczt = { package = "zakura-pczt", version = "=0.1.0-rc3", features = ["signer"] }
zcash_protocol.workspace = true
zip32.workspace = true
zip321 = "0.9"

[dev-dependencies]
# `oneshot` drives the router in tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
h2 = "0.4"
http = "1"
