[package]
name = "ths-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
async-stream = "0.3"
async-trait = "0.1"
bip39 = "2"
clap.workspace = true
hex.workspace = true
futures-core = "0.3"
futures-util = "0.3"
rand10 = { package = "rand", version = "0.10" }
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
secrecy = "0.8"
schemerz = "0.2"
schemerz-rusqlite = "0.370"
tonic = "0.14"

# Pin the Zakura type family even where API-facing values are serialized. The
# wallet adapter can never silently resolve the upstream LRZ crypto packages.
zcash_keys = { package = "zakura-keys", version = "=2.2.0", default-features = false, features = ["orchard", "transparent-inputs", "unstable"] }
zcash_primitives = { package = "zakura-primitives", version = "=2.2.0", default-features = false }
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc7", features = ["orchard", "transparent-inputs", "lightwalletd-tonic-transport"] }
zcash_client_sqlite = { package = "zakura-client-sqlite", version = "=0.1.0-rc7", features = ["orchard", "transparent-inputs", "unstable"] }
zcash_proofs = { package = "zakura-proofs", version = "=2.2.0", features = ["bundled-prover"] }
orchard = { package = "zakura-orchard", version = "=2.2.0" }
sapling = { package = "zakura-sapling-crypto", version = "=2.2.0", default-features = false }
pczt = { package = "zakura-pczt", version = "=0.1.0-rc4", features = ["signer"] }
transparent = { package = "zakura-transparent", version = "=2.2.0" }
zcash_script = "=0.4.5"
zcash_protocol.workspace = true
zip32.workspace = true
zip321 = { package = "zakura-zip321", version = "=2.2.0" }

[dev-dependencies]
# The live recovery fault proxy forwards lightwalletd's HTTP/2 gRPC streams.
reqwest = { workspace = true, features = ["http2"] }
axum = { workspace = true, features = ["http2"] }
# `oneshot` drives the router in tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
h2 = "0.4"
tokio = { workspace = true, features = ["test-util"] }
# The wallet SDK's in-memory chain/scanner harness for proposal-level tests.
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc7", features = ["test-dependencies"] }
zcash_client_sqlite = { package = "zakura-client-sqlite", version = "=0.1.0-rc7", features = ["test-dependencies"] }
