[package]
edition = "2024"
rust-version = "1.97"
name = "zakura-primitives"
version = "4.0.0"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust implementations of the Zcash primitives"
readme = "README.md"
keywords = [
    "cryptography",
    "primitives",
    "transactions",
    "zcash",
]
categories = ["cryptography::cryptocurrencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/common"

[package.metadata.docs.rs]
features = [
    "backend-halo2",
    "non-standard-fees",
    "temporary-zcashd",
    "test-dependencies",
    "transparent-inputs",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
backend-halo2 = ["orchard/backend-halo2"]
circuits = [
    "orchard/circuit",
    "sapling/circuit",
]
default = [
    "backend-halo2",
    "wallet",
    "multicore",
    "std",
    "circuits",
    "pczt",
]
document-features = []
expensive-tests = []
multicore = [
    "orchard/multicore",
    "sapling/multicore",
]
no-expensive-tests = []
non-standard-fees = []
pczt = [
    "wallet",
    "transparent/pczt",
]
std = [
    "document-features",
    "equihash/std",
    "redjubjub/std",
    "sapling/std",
    "orchard/std",
    "transparent/std",
]
temporary-zcashd = []
test-dependencies = [
    "wallet",
    "dep:proptest",
    "incrementalmerkletree/test-dependencies",
    "orchard/test-dependencies",
    "sapling/test-dependencies",
    "transparent/test-dependencies",
    "zcash_protocol/test-dependencies",
]
transparent-inputs = [
    "pczt",
    "transparent/transparent-inputs",
    "dep:secp256k1",
]
wallet = [
    "sapling/wallet",
    "orchard/wallet",
    "transparent/wallet",
]

[lib]
name = "zcash_primitives"
path = "src/lib.rs"
bench = false

[[bench]]
name = "note_decryption"
path = "benches/note_decryption.rs"
harness = false
required-features = [
    "circuits",
    "wallet",
]

