name: Discord Review Relay

# pull_request_review runs without secrets on fork PRs, so this workflow only
# marks that an approval happened. Discord Notifications picks it up through
# workflow_run and verifies the approval via the API before posting.

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    if: github.event.review.state == 'approved'
    steps:
      - run: echo "Approval relayed to Discord Notifications"
