name: Maintainer triage

on:
  issues:
    types: [opened, reopened, edited]
  workflow_run:
    workflows: [Triage event relay]
    types: [completed]
  workflow_dispatch:
    inputs:
      item_type:
        description: Item to triage
        required: true
        type: choice
        options: [issue, pull_request]
      item_number:
        description: Issue or pull request number
        required: true
        type: string

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: triage-${{ github.repository }}-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id || inputs.item_number }}
  cancel-in-progress: true

jobs:
  triage:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL || 'gpt-6-luna' }}
      TRIAGE_REASONING_EFFORT: ${{ vars.TRIAGE_REASONING_EFFORT || 'medium' }}
      TRIAGE_GITHUB_COMMENT: ${{ vars.TRIAGE_GITHUB_COMMENT || 'false' }}
      TRIAGE_APPLY_LABELS: ${{ vars.TRIAGE_APPLY_LABELS || 'false' }}
      TRIAGE_ALLOWED_ASSOCIATIONS: ${{ vars.TRIAGE_ALLOWED_ASSOCIATIONS }}
      TRIAGE_HISTORY_PAGES: ${{ vars.TRIAGE_HISTORY_PAGES || '2' }}
    steps:
      # workflow_run executes the trusted default-branch version. The relay
      # supplies only a PR number; contributor code and artifacts are unused.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Analyze and notify
        run: python3 .github/triage/triage.py
