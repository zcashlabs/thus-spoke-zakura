name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  promote-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote immutable images to latest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          version="$RELEASE_TAG"
          version="${version#v}"
          for image in thus-spoke-zakura-app thus-spoke-zakura-lightwalletd; do
            docker buildx imagetools inspect "ghcr.io/zcashlabs/$image:$version"
            docker buildx imagetools create \
              --tag "ghcr.io/zcashlabs/$image:latest" \
              "ghcr.io/zcashlabs/$image:$version"
          done

  public-smoke-test:
    needs: promote-images
    runs-on: ubuntu-24.04
    steps:
      - name: Install anonymously and pull exact images
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          THS_INSTALL_DIR: ${{ runner.temp }}/bin
        shell: bash
        run: |
          export THS_VERSION="$RELEASE_TAG"
          docker logout ghcr.io || true
          installer="https://raw.githubusercontent.com/zcashlabs/thus-spoke-zakura/$RELEASE_TAG/install.sh"
          if [[ "$RELEASE_TAG" == "v0.2.0" ]]; then
            # The immutable v0.2.0 installer still uses its original variable.
            curl --proto '=https' --tlsv1.2 -fsSL "$installer" \
              | TSZ_VERSION=v0.1.0 sh
          fi
          curl --proto '=https' --tlsv1.2 -fsSL "$installer" | sh
          curl --proto '=https' --tlsv1.2 -fsSL "$installer" \
            | THS_VERSION=latest THS_SKIP_IMAGE_PULL=1 sh
          "$THS_INSTALL_DIR/ths" --version
          "$THS_INSTALL_DIR/ths" update --check
