name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p thus-spoke-zakura --features release-distribution
      - run: tests/install.sh
      - name: Verify Zakura-only primitive packages
        run: |
          cargo metadata --format-version 1 | jq -e '
            ([.packages[].name] | any(. == "zakura-keys")) and
            ([.packages[].name] | any(. == "zakura-primitives")) and
            ([.packages[].name] | any(. == "zcash_keys") | not) and
            ([.packages[].name] | any(. == "zcash_primitives") | not)'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
