name: Release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.98.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p thus-spoke-zakura --features release-distribution
      - run: tests/install.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  launcher:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.0 --profile minimal --target "${{ matrix.target }}"
      - run: rustup default 1.98.0
      - run: cargo build --locked --release -p thus-spoke-zakura --features release-distribution --target "${{ matrix.target }}"
      - name: Package launcher
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/ths" dist/
          tar -C dist -czf "ths-${{ matrix.target }}.tar.gz" ths
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-${{ matrix.target }}
          path: ths-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  image-platforms:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: ghcr.io/zcashlabs/thus-spoke-zakura-app
            file: Dockerfile
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - name: app
            image: ghcr.io/zcashlabs/thus-spoke-zakura-app
            file: Dockerfile
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - name: lightwalletd
            image: ghcr.io/zcashlabs/thus-spoke-zakura-lightwalletd
            file: docker/lightwalletd.Dockerfile
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - name: lightwalletd
            image: ghcr.io/zcashlabs/thus-spoke-zakura-lightwalletd
            file: docker/lightwalletd.Dockerfile
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ matrix.image }}:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/zcashlabs/thus-spoke-zakura
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record image digest
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="$(docker buildx imagetools inspect \
            "${{ matrix.image }}:${{ needs.version.outputs.version }}-${{ matrix.arch }}" \
            --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifests:
    if: github.event_name == 'push'
    needs: [version, image-platforms]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: ghcr.io/zcashlabs/thus-spoke-zakura-app
          - name: lightwalletd
            image: ghcr.io/zcashlabs/thus-spoke-zakura-lightwalletd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-${{ matrix.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        name: Create multi-platform manifest
        shell: bash
        run: |
          image="${{ matrix.image }}"
          sources=()
          while IFS= read -r digest; do
            sources+=("$image@sha256:$(basename "$digest")")
          done < <(find "${{ runner.temp }}/digests" -type f | sort)
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            --tag "$image:${{ needs.version.outputs.version }}" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect \
            "$image:${{ needs.version.outputs.version }}" \
            --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify manifest platforms
        shell: bash
        run: |
          image="${{ matrix.image }}:${{ needs.version.outputs.version }}"
          platforms="$(docker buildx imagetools inspect "$image" \
            --format '{{range .Manifest.Manifests}}{{if .Platform}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}{{end}}')"
          grep -qx 'linux/amd64' <<< "$platforms"
          grep -qx 'linux/arm64' <<< "$platforms"
      - name: Attest multi-platform manifest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  draft:
    if: github.event_name == 'push'
    needs: [version, launcher, image-manifests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: launcher-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: |
          cp ../install.sh install.sh
          sha256sum -- install.sh *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: "dist/*"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --generate-notes \
            --title "Thus Spoke Zakura $GITHUB_REF_NAME"
