name: Deploy website and book

# Pull requests can change any file here, including this workflow, so the
# deployment credential is kept out of their reach:
#
# - Pull requests use `pull_request`, never `pull_request_target`, and only
#   run the build job. Fork pull requests get a read-only token and no secrets.
# - VERCEL_TOKEN is a secret of the `website-production` environment, whose
#   deployment branch policy admits only `main`. A pull request that edits
#   this file to reference the environment is refused by that policy.
# - The deploy job runs nothing resolved at run time: actions are pinned to
#   commits, and the Vercel CLI to a checksum. It checks out no code.
#
# website/README.md lists the repository and Vercel settings this relies on.

on:
  push:
    branches: [main]
    paths: &site-paths
      - "website/**"
      - "book/**"
      - "theme/**"
      - "book.toml"
      - "tools/build_site.py"
      - "tools/build_website.py"
      - "tests/book_links.py"
      - "vercel.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths: *site-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  # A newer push supersedes a pull request's build. Deployments from main
  # queue instead, so none is interrupted partway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test website/tests/*.test.mjs
      - run: python3 tests/book_links.py
      - name: Install mdBook
        run: |
          set -euo pipefail
          version=0.5.2
          archive="mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          # The deployed site is mdBook's output, so the binary is verified
          # against the release asset's published digest before it runs.
          # Keep in step with .github/workflows/ci.yml.
          sha256=084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${version}/${archive}"
          echo "${sha256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" mdbook
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mdbook build
      - run: python3 tools/build_site.py
      - run: python3 tools/build_website.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-website
          path: site/deploy
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: >-
      github.repository == 'zcashlabs/thus-spoke-zakura' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website-production
      url: https://ths.zypherpunk.xyz
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Validate deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "Set the VERCEL_ORG_ID variable" >&2; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Set the VERCEL_PROJECT_ID variable" >&2; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "Set the VERCEL_TOKEN secret" >&2; exit 1; }
      - name: Install Vercel CLI
        run: |
          set -euo pipefail
          version=65.4.0
          # On Linux x64 the `vercel` npm package only launches this
          # self-contained binary; its other 285 dependencies are a fallback
          # for platforms without one. Installing the binary alone, checked
          # against the registry's integrity value, avoids resolving any of them.
          integrity=sha512-o6ZFKKBPTWIYyPvVsDe4pbJdS9ZoFpP8seAsO6UaYwL1H3JWR2yYQMWVogzfkB1zX9LnEN4JrclGufHi+9Sf/A==
          archive="$RUNNER_TEMP/vc-native-linux-x64-${version}.tgz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://registry.npmjs.org/@vercel/vc-native-linux-x64/-/vc-native-linux-x64-${version}.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w0)"
          test "$actual" = "$integrity" || { echo "Vercel CLI checksum mismatch: $actual" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/vercel"
          tar -xzf "$archive" -C "$RUNNER_TEMP/vercel" --strip-components=2 package/bin/vercel
          "$RUNNER_TEMP/vercel/vercel" --version
          echo "$RUNNER_TEMP/vercel" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-website
          path: site/deploy
      - name: Pull production project settings
        working-directory: site/deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production
      - name: Build static deployment
        working-directory: site/deploy
        run: vercel build --prod
      - name: Deploy website and book
        working-directory: site/deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes
