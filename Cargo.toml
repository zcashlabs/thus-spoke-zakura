[workspace]
resolver = "2"
members = ["crates/ths-cli", "crates/ths-server"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/zcashlabs/thus-spoke-zakura"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
hex = "0.4"
nix = { version = "0.31", features = ["process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
semver = { version = "1.0", features = ["serde"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zcash_protocol = { package = "zakura-protocol", version = "=4.0.0", features = ["local-consensus"] }
zip32 = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keep workspace crates quick to rebuild and easy to debug while avoiding
# prohibitively slow cryptographic proving in unoptimized dependencies.
[profile.dev-runtime]
inherits = "dev"

[profile.dev-runtime.package."*"]
opt-level = 3
