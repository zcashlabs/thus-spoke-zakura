[workspace]
resolver = "2"
members = ["crates/tsz-cli", "crates/tsz-server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcashlabs/thus-spoke-zakura"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
directories = "6.0"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zcash_protocol = { version = "0.10.6", features = ["local-consensus"] }
zip32 = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keep workspace crates quick to rebuild and easy to debug while avoiding
# prohibitively slow cryptographic proving in unoptimized dependencies.
[profile.dev-runtime]
inherits = "dev"

[profile.dev-runtime.package."*"]
opt-level = 3

# rc5's published manifest resolves zakura-pczt rc3, but the published rc3 is
# missing the transaction extractor API used by rc5's migrations. Keep the
# package name/version while sourcing the matching upstream revision.
[patch.crates-io]
zakura-pczt = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f27e416f042c1b18218b9d0c6be19ba27ad6ba4f", package = "zakura-pczt" }
zakura-client-backend = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f27e416f042c1b18218b9d0c6be19ba27ad6ba4f", package = "zakura-client-backend" }
zakura-client-sqlite = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "f27e416f042c1b18218b9d0c6be19ba27ad6ba4f", package = "zakura-client-sqlite" }
