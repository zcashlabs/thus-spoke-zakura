<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 0 912 468" width="912" height="468" role="img" aria-label="Mining pays every block reward to hidden Account 6's transparent balance; shielding a matured reward moves it to Account 6's Orchard balance, which is the pool every faucet payment spends from into accounts 1 to 5.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 16px; font-weight: 600; }
.k { font-size: 11px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 14px; }
.s { font-size: 12px; fill: var(--muted); }
.a { font-size: 13px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<text class="t" x="48" y="46">Where faucet money comes from</text>
<rect class="note" x="48" y="80" width="904" height="48" rx="8"/>
<text class="l" x="500.0" y="108.0" text-anchor="middle">One fixed development seed derives all six accounts</text>
<rect class="card" x="48" y="160" width="300" height="62" rx="8"/>
<text class="l" x="198.0" y="188.0" text-anchor="middle">Mining a block</text>
<text class="s" x="198.0" y="206.0" text-anchor="middle">zakurad.toml names the miner</text>
<rect class="card" x="48" y="262" width="300" height="62" rx="8"/>
<text class="l" x="198.0" y="290.0" text-anchor="middle">Account 6 · transparent</text>
<text class="s" x="198.0" y="308.0" text-anchor="middle">every coinbase reward</text>
<rect class="card" x="48" y="364" width="300" height="62" rx="8"/>
<text class="l" x="198.0" y="392.0" text-anchor="middle">Account 6 · Orchard</text>
<text class="s" x="198.0" y="410.0" text-anchor="middle">the faucet's spending pool</text>
<path class="flow" d="M198 222 L198 254" marker-end="url(#ar-a)"/>
<text class="s" x="210" y="242.0" text-anchor="start">reward</text>
<path class="flow" d="M198 324 L198 356" marker-end="url(#ar-a)"/>
<text class="s" x="210" y="344.0" text-anchor="start">shield at 100 confs</text>
<rect class="zone" x="392" y="148" width="560" height="196" rx="12"/>
<text class="k" x="408" y="170">ACCOUNTS 1–5 — THE ONLY ONES THE API RETURNS</text>
<rect class="card-a" x="412" y="184" width="156" height="58" rx="8"/>
<text class="l" x="490.0" y="210.0" text-anchor="middle">Account 1</text>
<text class="s" x="490.0" y="228.0" text-anchor="middle">opens with 5 ZEC</text>
<rect class="card" x="596" y="184" width="156" height="58" rx="8"/>
<text class="l" x="674.0" y="210.0" text-anchor="middle">Account 2</text>
<text class="s" x="674.0" y="228.0" text-anchor="middle">transparent | Orchard</text>
<rect class="card" x="780" y="184" width="156" height="58" rx="8"/>
<text class="l" x="858.0" y="210.0" text-anchor="middle">Account 3</text>
<text class="s" x="858.0" y="228.0" text-anchor="middle">transparent | Orchard</text>
<rect class="card" x="412" y="266" width="156" height="58" rx="8"/>
<text class="l" x="490.0" y="292.0" text-anchor="middle">Account 4</text>
<text class="s" x="490.0" y="310.0" text-anchor="middle">transparent | Orchard</text>
<rect class="card" x="596" y="266" width="156" height="58" rx="8"/>
<text class="l" x="674.0" y="292.0" text-anchor="middle">Account 5</text>
<text class="s" x="674.0" y="310.0" text-anchor="middle">transparent | Orchard</text>
<path class="flow" d="M348 395 L674 395 L674 352" marker-end="url(#ar-a)"/>
<text class="s" x="511" y="385" text-anchor="middle">faucet</text>
<text class="s" x="500" y="450" text-anchor="middle">Account 6 never appears in /api/v1/accounts or any displayed balance</text>
</svg>
