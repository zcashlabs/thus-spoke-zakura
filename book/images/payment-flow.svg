<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 0 912 420" width="912" height="420" role="img" aria-label="A send or faucet request is validated, then its idempotency key is looked up. A recorded key returns the stored activity. A new key is built and broadcast, then recorded, then confirmed. The broadcast happens before the record, so a crash in between leaves a live transaction with no row.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 16px; font-weight: 600; }
.k { font-size: 11px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 14px; }
.s { font-size: 12px; fill: var(--muted); }
.a { font-size: 13px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<text class="t" x="48" y="46">A payment, and the gap that makes a lost response ambiguous</text>
<rect class="card" x="48.0" y="92" width="205.0" height="64" rx="8"/>
<text class="l" x="150.5" y="121.0" text-anchor="middle">POST /send</text>
<text class="s" x="150.5" y="139.0" text-anchor="middle">or POST /faucet</text>
<rect class="card" x="281.0" y="92" width="205.0" height="64" rx="8"/>
<text class="l" x="383.5" y="121.0" text-anchor="middle">Validate</text>
<text class="s" x="383.5" y="139.0" text-anchor="middle">accounts, pools, key</text>
<rect class="card" x="514.0" y="92" width="205.0" height="64" rx="8"/>
<text class="l" x="616.5" y="121.0" text-anchor="middle">Look up the key</text>
<text class="s" x="616.5" y="139.0" text-anchor="middle">in tsz.db</text>
<rect class="note" x="747.0" y="92" width="205.0" height="64" rx="8"/>
<text class="l" x="849.5" y="121.0" text-anchor="middle">Return the stored row</text>
<text class="s" x="849.5" y="139.0" text-anchor="middle">nothing is built</text>
<path class="flow" d="M253.0 124 L273.0 124" marker-end="url(#ar-a)"/>
<path class="flow" d="M486.0 124 L506.0 124" marker-end="url(#ar-a)"/>
<path class="flow" d="M719.0 124 L739.0 124" marker-end="url(#ar-a)"/>
<text class="s" x="733.0" y="80" text-anchor="middle">recorded</text>
<path class="flow" d="M616.5 156 L616.5 196 L189.33333333333334 196 L189.33333333333334 232" marker-end="url(#ar-a)"/>
<text class="s" x="500" y="188" text-anchor="middle">new key</text>
<rect class="card" x="48.0" y="240" width="282.6666666666667" height="64" rx="8"/>
<text class="l" x="189.33333333333334" y="269.0" text-anchor="middle">Build + broadcast</text>
<text class="s" x="189.33333333333334" y="287.0" text-anchor="middle">through lightwalletd</text>
<rect class="card" x="358.6666666666667" y="240" width="282.6666666666667" height="64" rx="8"/>
<text class="l" x="500.0" y="269.0" text-anchor="middle">Record in tsz.db</text>
<text class="s" x="500.0" y="287.0" text-anchor="middle">txid + key, status broadcast</text>
<rect class="card" x="669.3333333333334" y="240" width="282.6666666666667" height="64" rx="8"/>
<text class="l" x="810.6666666666667" y="269.0" text-anchor="middle">Confirm</text>
<text class="s" x="810.6666666666667" y="287.0" text-anchor="middle">mine one block if needed</text>
<path class="flow" d="M330.6666666666667 272 L350.6666666666667 272" marker-end="url(#ar-a)"/>
<path class="flow" d="M641.3333333333334 272 L661.3333333333334 272" marker-end="url(#ar-a)"/>
<rect class="card-a" x="194.66666666666669" y="330" width="300" height="50" rx="8"/>
<text class="l" x="344.6666666666667" y="352.0" text-anchor="middle">Ambiguous gap</text>
<text class="s" x="344.6666666666667" y="370.0" text-anchor="middle">the broadcast happens first</text>
<path class="lead" d="M344.6666666666667 304 L344.6666666666667 330"/>
<text class="s" x="500" y="400" text-anchor="middle">a missing activity row does not prove nothing was sent</text>
</svg>
