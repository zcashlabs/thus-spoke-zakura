<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 0 912 412" width="912" height="412" role="img" aria-label="About every two seconds the server asks Zakura for its height and hash and compares them with the wallet's scanned checkpoint. When they match it stays ready; when either moved it waits for the index, rewinds if the stored hashes disagree, rescans and publishes. On error the last good snapshot stays visible.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 16px; font-weight: 600; }
.k { font-size: 11px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 14px; }
.s { font-size: 12px; fill: var(--muted); }
.a { font-size: 13px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<text class="t" x="48" y="46">How the wallet catches up with the node</text>
<rect class="card" x="48.0" y="92" width="282.6666666666667" height="64" rx="8"/>
<text class="l" x="189.33333333333334" y="121.0" text-anchor="middle">Ask Zakura for its tip</text>
<text class="s" x="189.33333333333334" y="139.0" text-anchor="middle">height and hash, every 2s</text>
<rect class="card" x="358.6666666666667" y="92" width="282.6666666666667" height="64" rx="8"/>
<text class="l" x="500.0" y="121.0" text-anchor="middle">Compare with the wallet</text>
<text class="s" x="500.0" y="139.0" text-anchor="middle">fully scanned checkpoint</text>
<rect class="note" x="669.3333333333334" y="92" width="282.6666666666667" height="64" rx="8"/>
<text class="l" x="810.6666666666667" y="121.0" text-anchor="middle">Stay ready</text>
<text class="s" x="810.6666666666667" y="139.0" text-anchor="middle">nothing to do</text>
<path class="flow" d="M330.6666666666667 124 L350.6666666666667 124" marker-end="url(#ar-a)"/>
<path class="flow" d="M641.3333333333334 124 L661.3333333333334 124" marker-end="url(#ar-a)"/>
<text class="s" x="655.3333333333334" y="80" text-anchor="middle">same pair</text>
<path class="flow" d="M500.0 156 L500.0 196 L189.33333333333334 196 L189.33333333333334 232" marker-end="url(#ar-a)"/>
<text class="s" x="400" y="188" text-anchor="middle">height or hash moved</text>
<rect class="card" x="48.0" y="240" width="282.6666666666667" height="64" rx="8"/>
<text class="l" x="189.33333333333334" y="269.0" text-anchor="middle">Wait for the index</text>
<text class="s" x="189.33333333333334" y="287.0" text-anchor="middle">lightwalletd reaches it</text>
<rect class="card" x="358.6666666666667" y="240" width="282.6666666666667" height="64" rx="8"/>
<text class="l" x="500.0" y="269.0" text-anchor="middle">Rewind if hashes differ</text>
<text class="s" x="500.0" y="287.0" text-anchor="middle">back to the last match</text>
<rect class="card-a" x="669.3333333333334" y="240" width="282.6666666666667" height="64" rx="8"/>
<text class="l" x="810.6666666666667" y="269.0" text-anchor="middle">Rescan and publish</text>
<text class="s" x="810.6666666666667" y="287.0" text-anchor="middle">then report ready</text>
<path class="flow" d="M330.6666666666667 272 L350.6666666666667 272" marker-end="url(#ar-a)"/>
<path class="flow" d="M641.3333333333334 272 L661.3333333333334 272" marker-end="url(#ar-a)"/>
<rect class="note" x="290" y="330" width="420" height="50" rx="8"/>
<text class="l" x="500.0" y="352.0" text-anchor="middle">On error the last good snapshot stays</text>
<text class="s" x="500.0" y="370.0" text-anchor="middle">state reports error until a scan succeeds</text>
<path class="lead" d="M500 304 L500 330"/>
<text class="s" x="500" y="400" text-anchor="middle">then the loop comes round again, about two seconds later</text>
</svg>
