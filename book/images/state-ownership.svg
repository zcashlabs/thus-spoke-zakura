<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 0 912 372" width="912" height="372" role="img" aria-label="The chain flows left to right from Zakura through lightwalletd's index into the server wallet's scan, which publishes an account snapshot the dashboard reads. SQLite activity is a separate path, written when the server sends rather than when it scans.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 16px; font-weight: 600; }
.k { font-size: 11px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 14px; }
.s { font-size: 12px; fill: var(--muted); }
.a { font-size: 13px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<text class="t" x="48" y="46">One change, and who owns each answer</text>
<rect class="card" x="48.0" y="104" width="161.6" height="68" rx="8"/>
<text class="l" x="128.8" y="135.0" text-anchor="middle">Zakura</text>
<text class="s" x="128.8" y="153.0" text-anchor="middle">chain, tip hash</text>
<rect class="card" x="233.6" y="104" width="161.6" height="68" rx="8"/>
<text class="l" x="314.4" y="135.0" text-anchor="middle">lightwalletd</text>
<text class="s" x="314.4" y="153.0" text-anchor="middle">compact index</text>
<rect class="card" x="419.2" y="104" width="161.6" height="68" rx="8"/>
<text class="l" x="500.0" y="135.0" text-anchor="middle">wallet.db</text>
<text class="s" x="500.0" y="153.0" text-anchor="middle">scan + rewind</text>
<rect class="card-a" x="604.8" y="104" width="161.6" height="68" rx="8"/>
<text class="l" x="685.5999999999999" y="135.0" text-anchor="middle">Snapshot</text>
<text class="s" x="685.5999999999999" y="153.0" text-anchor="middle">balances, state</text>
<rect class="card" x="790.4" y="104" width="161.6" height="68" rx="8"/>
<text class="l" x="871.1999999999999" y="135.0" text-anchor="middle">Dashboard</text>
<text class="s" x="871.1999999999999" y="153.0" text-anchor="middle">query hooks</text>
<path class="flow" d="M209.6 138.0 L225.6 138.0" marker-end="url(#ar-a)"/>
<text class="s" x="221.6" y="92" text-anchor="middle">blocks</text>
<path class="flow" d="M395.2 138.0 L411.2 138.0" marker-end="url(#ar-a)"/>
<text class="s" x="407.2" y="92" text-anchor="middle">compact blocks</text>
<path class="flow" d="M580.8 138.0 L596.8 138.0" marker-end="url(#ar-a)"/>
<text class="s" x="592.8" y="92" text-anchor="middle">canonical check</text>
<path class="flow" d="M766.4 138.0 L782.4 138.0" marker-end="url(#ar-a)"/>
<text class="s" x="778.4" y="92" text-anchor="middle">/api/v1/accounts</text>
<rect class="card" x="48.0" y="250" width="436.0" height="56" rx="8"/>
<text class="l" x="266.0" y="275.0" text-anchor="middle">tsz.db activity</text>
<text class="s" x="266.0" y="293.0" text-anchor="middle">txid + key, written on send</text>
<rect class="card" x="516.0" y="250" width="436.0" height="56" rx="8"/>
<text class="l" x="734.0" y="275.0" text-anchor="middle">GET /api/v1/activity</text>
<text class="s" x="734.0" y="293.0" text-anchor="middle">what this server did</text>
<path class="thin" d="M484.0 278 L508.0 278" marker-end="url(#ar-n)"/>
<text class="s" x="500" y="340" text-anchor="middle">a separate path — activity is not a balance ledger</text>
</svg>
