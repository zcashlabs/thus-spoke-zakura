<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 0 912 440" width="912" height="440" role="img" aria-label="The web and server sources build the app image, the lightwalletd Dockerfile builds the lightwalletd image, and Zakura is pinned and pulled. ths start refuses to run until all three exist. Editing source changes neither a running container nor an existing image.">
